scalar Date
scalar DateTime

type Query {
    allBlogs: [Blog]
    allComments: [Comment]
}

type Picture {
    blog: Blog
    pictures: String
}

type Tag {
    blog: Blog
    name: String
}

type Blog {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    category: String
    citation: String
    content: String
    date: Date
    resume: String
    title: String
    author: Author
    comments: [Comment]  
    pictures: [Picture]
    tags: [Tag]
}

type Comment {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    email: String
    name: String
    text: String
    blog: Blog
}