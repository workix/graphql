scalar Date
scalar DateTime

type Query {
    allBlogs: [Blog]
    getBlogById(id: ID!): Blog
    allBlogsPaginated(page: Int!, limit: Int!): PaginatedListBlog
    allComments: [Comment]
    getCommentById(id: ID!): Comment
    allCommentsPaginated(page: Int!, limit: Int!): PaginatedListComment
}

type Picture {
    blog: Blog
    pictures: String
}

type Tag {
    blog: Blog
    name: String
}

type Blog {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    category: String
    citation: String
    content: String
    date: Date
    resume: String
    title: String
    author: Author
    comments: [Comment]  
    pictures: [Picture]
    tags: [Tag]
}

type Comment {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    email: String
    name: String
    text: String
    blog: Blog
}

type PaginatedListBlog {
    rows: [Blog]
    start: Int
    end: Int,
    totalPages: Int,
    currentPage: Int,
    limitRows: Int,
    maxRows: Int
}

type PaginatedListComment {
    rows: [Comment]
    start: Int
    end: Int,
    totalPages: Int,
    currentPage: Int,
    limitRows: Int,
    maxRows: Int
}