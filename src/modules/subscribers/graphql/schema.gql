scalar Date
scalar DateTime

type Query {
    allSubscribers(start: Int, max: Int): [Subscriber]
    getSubscriberById(id: ID!): Subscriber
    allSubscribersPaginated(page: Int!, limit: Int!): PaginatedListSubscriber
}

type Mutation {
    createSubscriber(input: SubscriberInput!): Subscriber
    deleteSubscriber(id: ID!) : Boolean
    updateSubscriber(id: ID!, input: SubscriberInput!): Subscriber
    subscribeMail(email: String!) : Boolean
}

type Subscriber {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    email: String
}

input SubscriberInput {
    email: String!
}

type PaginatedListSubscriber {
    subscribers: [Subscriber]
    start: Int
    end: Int,
    totalPages: Int,
    currentPage: Int,
    limitRows: Int,
    maxRows: Int
}