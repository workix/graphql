scalar Date
scalar DateTime

type Query{
    allJobs(start: Int, max: Int): [Job]
    getJobById(id: ID!): Job
    allJobsPaginated(page: Int!, limit: Int!): PaginatedListJob
    debugJob: [Job],
    allJobsFeatured(start: Int, max: Int, featured: Boolean!): [Job]
    allSponsoredJobs(start: Int, max: Int): [Job]
    listJobRandomFeatured: [Job]
    getJobByCompanyId(companyId: ID!) : [Job]
    getJobByIdAndCompanyId(id: ID!, companyId: ID!) : Job
    myJobs: [Job]
}

type Mutation {
    createJob(input: JobInput!): Job
    deleteJob(id: ID!) : Boolean
    updateJob(id: ID!, input: JobInput!): Job
    subscribeInJob(input: SubscribeInJobInput!): Boolean
    expireJobs: JobExpirationResult
    closeJobWithOutcome(jobId: ID!, outcomeStatus: String!): Job
}

type JobExpirationResult {
    totalExpired: Int
    expiredJobIds: [ID]
}

type Job {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    activated: Boolean
    benefits: String
    description: String
    featured: Boolean
    expiresAt: DateTime
    outcomeStatus: String
    isSponsored: Boolean
    sponsorLabel: String
    jobCategory: JobCategory
    jobType: JobType
    maxPayment: Float
    minPayment: Float
    requirement: String
    title: String
    company: Company
    candidates: [Candidate]
}

input JobInput {
    activated: Boolean!
    benefits: String!
    description: String!
    featured: Boolean!
    expiresAt: DateTime
    outcomeStatus: String
    isSponsored: Boolean
    sponsorLabel: String
    jobCategory: JobCategory!
    jobType: JobType!
    maxPayment: Float!
    minPayment: Float!
    requirement: String!
    title: String!
    companyId: Int!
}

enum JobCategory {
    MANAGEMENT, OPERATOR
}

enum JobType {
    FREELANCE, FULLTIME, INTERNSHIP, PARTTIME, TEMPORARY, VOLUNTEER
}


type PaginatedListJob {
    jobs: [Job]
    start: Int
    end: Int,
    totalPages: Int,
    currentPage: Int,
    limitRows: Int,
    maxRows: Int
}

input SubscribeInJobInput{
    jobId: ID!
    candidateId: ID!
}