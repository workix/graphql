scalar Date
scalar DateTime

type Query{
    allJobs(start: Int, max: Int): [Job]
    getJobById(id: ID!): Job
    allJobsPaginated(page: Int!, limit: Int!): PaginatedListJob
    debugJob: [Job],
    allJobsFeatured(start: Int, max: Int, featured: Boolean!): [Job]
    allSponsoredJobs(start: Int, max: Int): [Job]
    allPcdJobs(start: Int, max: Int): [Job]
    allRemoteJobs(start: Int, max: Int): [Job]
    listJobRandomFeatured: [Job]
    getJobByCompanyId(companyId: ID!) : [Job]
    getJobByIdAndCompanyId(id: ID!, companyId: ID!) : Job
    myJobs: [Job]
    searchJobs(query: String, filter: JobSearchFilterInput, sortBy: JobSearchSortBy, page: Int, limit: Int): JobSearchResult!
    jobSearchFacets(query: String, filter: JobSearchFilterInput): JobSearchFacets!
    jobSearchSuggestions(prefix: String!): [JobSuggestion!]!
}

type Mutation {
    createJob(input: JobInput!): Job
    deleteJob(id: ID!) : Boolean
    updateJob(id: ID!, input: JobInput!): Job
    subscribeInJob(input: SubscribeInJobInput!): Boolean
    expireJobs: JobExpirationResult
    closeJobWithOutcome(jobId: ID!, outcomeStatus: String!): Job
    boostJob(jobId: ID!, organizationId: ID!, durationDays: Int): JobBoostResult
    reindexAllJobs: ReindexResult!
}

type ReindexResult {
    totalIndexed: Int!
}

type JobBoostResult {
    id: ID
    jobId: ID
    organizationId: ID
    startsAt: DateTime
    endsAt: DateTime
    label: String
    status: String
}

type JobExpirationResult {
    totalExpired: Int
    expiredJobIds: [ID]
}

type FacetCount {
    key: String!
    count: Int!
}

type JobSearchFacets {
    workplaceTypes: [FacetCount!]!
    jobTypes: [FacetCount!]!
    levels: [FacetCount!]!
    states: [FacetCount!]!
    topSkills: [FacetCount!]!
    pcdCount: Int!
    remoteCount: Int!
    pcdRemoteCount: Int!
}

type JobSuggestion {
    text: String!
    category: String!
}

type JobSearchResult {
    jobs: [Job!]!
    totalCount: Int!
    page: Int!
    totalPages: Int!
    sponsoredJobs: [Job!]!
    facets: JobSearchFacets
}

enum JobSearchSortBy {
    RELEVANCE
    RECENT
    SALARY_DESC
    SALARY_ASC
}

input JobSearchFilterInput {
    workplaceType: String
    jobType: String
    jobCategory: String
    seniorityLevel: String
    state: String
    city: String
    skills: [String]
    salaryMin: Float
    salaryMax: Float
    companyId: ID
    isPcd: Boolean
    isRemote: Boolean
}

type Job {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    activated: Boolean
    benefits: String
    description: String
    featured: Boolean
    expiresAt: DateTime
    outcomeStatus: String
    isSponsored: Boolean
    sponsorLabel: String
    isPcd: Boolean
    isRemote: Boolean
    pcdDetails: String
    accessibilityFeatures: [String]
    skills: [String]
    workplaceType: String
    seniorityLevel: String
    city: String
    state: String
    jobCategory: JobCategory
    jobType: JobType
    maxPayment: Float
    minPayment: Float
    requirement: String
    title: String
    company: Company
    candidates: [Candidate]
}

input JobInput {
    activated: Boolean!
    benefits: String!
    description: String!
    featured: Boolean!
    expiresAt: DateTime
    outcomeStatus: String
    isSponsored: Boolean
    sponsorLabel: String
    isPcd: Boolean
    isRemote: Boolean
    pcdDetails: String
    accessibilityFeatures: [String]
    skills: [String]
    workplaceType: String
    seniorityLevel: String
    city: String
    state: String
    jobCategory: JobCategory!
    jobType: JobType!
    maxPayment: Float!
    minPayment: Float!
    requirement: String!
    title: String!
    companyId: Int!
}

enum JobCategory {
    MANAGEMENT, OPERATOR
}

enum JobType {
    FREELANCE, FULLTIME, INTERNSHIP, PARTTIME, TEMPORARY, VOLUNTEER
}

type PaginatedListJob {
    jobs: [Job]
    start: Int
    end: Int,
    totalPages: Int,
    currentPage: Int,
    limitRows: Int,
    maxRows: Int
}

input SubscribeInJobInput{
    jobId: ID!
    candidateId: ID!
}