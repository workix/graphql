scalar Date
scalar DateTime

type Query {
    allCandidates(start: Int, max: Int): [Candidate]
    allCandidatesRedis: [Candidate]
    getCandidateById(id: ID!): Candidate
    findCandidateByUserId(userId: ID!): Candidate
    allCandidatesPaginated(page: Int!, limit: Int!): PaginatedListCandidate
    myVisibilitySettings(candidateId: ID!): VisibilitySettings
    searchCandidates(query: String, filter: CandidateSearchFilterInput, page: Int, limit: Int): CandidateSearchResult!
    candidateSearchFacets(query: String, filter: CandidateSearchFilterInput): CandidateSearchFacets!
    candidateActiveProcesses(candidateId: ID!): CandidateActiveProcessesResponse
    candidateActiveProcessesSummary(candidateId: ID!): CandidateActiveProcessesSummary
}

type Mutation {
    createCandidate(input: CandidateInput!): Candidate
    deleteCandidate(id: ID!) : Boolean
    updateCandidate(id: ID!, input: CandidateInput!): Candidate
    updateCandidateCareerStatus(candidateId: ID!, input: CandidateCareerStatusInput!): Candidate
    updateVisibilitySettings(candidateId: ID!, input: VisibilitySettingsInput!): VisibilitySettings
    notifyCandidate(input: NotificationInput!): Boolean
    unlockCandidateContact(organizationId: ID!, userId: ID!, candidateId: ID!): ContactUnlockResult
}

type ContactUnlockResult {
    unlocked: Boolean
    unlockedAt: DateTime
    notifiedAt: DateTime
    candidate: Candidate
}

type Candidate {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    contact: Contact
    locale: Locale
    name: String
    birthDate: Date
    cpf: Float   
    user: User 
    resume: Resume
    normalizedResume: NormalizedResume
    visibilitySettings: VisibilitySettings
    lookingForJob: Boolean
    inCareerTransition: Boolean
    careerTransitionTarget: String
    acceptsEntryLevel: Boolean
    activeProcessesSummary: CandidateActiveProcessesSummary
    activeProcesses: [CandidateActiveProcess]
}

type CandidateActiveProcess {
    id: ID!
    selectiveProcessId: ID
    jobId: ID
    jobTitle: String
    companyId: ID
    companyName: String
    companyLogo: String
    isConfidential: Boolean
    status: String
    currentStage: String
    subscribedAt: DateTime
    updatedAt: DateTime
}

type CandidateActiveProcessesSummary {
    hasActiveProcesses: Boolean!
    totalCount: Int!
    isRestricted: Boolean!
    restrictionReason: String
}

type CandidateActiveProcessesResponse {
    candidateId: ID!
    hasActiveProcesses: Boolean!
    totalCount: Int!
    isRestricted: Boolean!
    processes: [CandidateActiveProcess!]!
}

type NormalizedResume {
    id: ID
    candidateId: ID
    rawMarkdown: String
    summary: String
    skills: [String]
    careerGoals: String
    completenessScore: Int
    createdAt: DateTime
    updatedAt: DateTime
}

input CandidateCareerStatusInput {
    lookingForJob: Boolean
    inCareerTransition: Boolean
    careerTransitionTarget: String
    acceptsEntryLevel: Boolean
}

type VisibilitySettings {
    id: ID
    candidateId: ID
    searchableByRecruiters: Boolean
    openToWorkVisible: Boolean
    showAsViewed: Boolean
    shareActiveProcessesWithRecruiters: Boolean
}

input VisibilitySettingsInput {
    searchableByRecruiters: Boolean
    openToWorkVisible: Boolean
    showAsViewed: Boolean
    shareActiveProcessesWithRecruiters: Boolean
}

type Contact {
    mobilePhone: Float
}

type Locale {
    city: String
    state: String
    neighborhood: String
    number: String
    street: String
    zipCode: Int
}

input CandidateInput {    
    mobilePhone: Float!
    city: String!
    state: String!
    neighborhood: String!
    number: String!
    street: String!
    zipCode: Int!
    name: String!
    birthDate: Date!
    cpf: Float   
    userId: Int!
    lookingForJob: Boolean
    inCareerTransition: Boolean
    careerTransitionTarget: String
    acceptsEntryLevel: Boolean
}

type PaginatedListCandidate {
    candidates: [Candidate]
    start: Int
    end: Int,
    totalPages: Int,
    currentPage: Int,
    limitRows: Int,
    maxRows: Int
}

input NotificationInput {
    type: NotificationType!
    userId: Int!
    title: String!
    message: String!
}

enum NotificationType {
    MAIL,
    PUSH
}

type CandidateFacetItem {
    key: String!
    count: Int!
}

type CandidateSearchFacets {
    lookingForJobCount: Int!
    inCareerTransitionCount: Int!
    acceptsEntryLevelCount: Int!
    states: [CandidateFacetItem!]!
    skills: [CandidateFacetItem!]!
    careerTransitionTargets: [CandidateFacetItem!]!
}

type CandidateSearchResult {
    candidates: [Candidate!]!
    totalCount: Int!
    page: Int!
    totalPages: Int!
    facets: CandidateSearchFacets
}

input CandidateSearchFilterInput {
    lookingForJob: Boolean
    inCareerTransition: Boolean
    careerTransitionTarget: String
    acceptsEntryLevel: Boolean
    state: String
    city: String
    skills: [String]
    keywords: String
    minCompletenessScore: Int
}

