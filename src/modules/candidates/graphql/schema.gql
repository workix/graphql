scalar Date
scalar DateTime

type Query {
    allCandidates(start: Int, max: Int): [Candidate]
    allCandidatesRedis: [Candidate]
    getCandidateById(id: ID!): Candidate
    findCandidateByUserId(userId: ID!): Candidate
    allCandidatesPaginated(page: Int!, limit: Int!): PaginatedListCandidate
    myVisibilitySettings(candidateId: ID!): VisibilitySettings
}

type Mutation {
    createCandidate(input: CandidateInput!): Candidate
    deleteCandidate(id: ID!) : Boolean
    updateCandidate(id: ID!, input: CandidateInput!): Candidate
    updateCandidateCareerStatus(candidateId: ID!, input: CandidateCareerStatusInput!): Candidate
    updateVisibilitySettings(candidateId: ID!, input: VisibilitySettingsInput!): VisibilitySettings
    notifyCandidate(input: NotificationInput!): Boolean
    unlockCandidateContact(organizationId: ID!, userId: ID!, candidateId: ID!): ContactUnlockResult
}

type ContactUnlockResult {
    unlocked: Boolean
    unlockedAt: DateTime
    notifiedAt: DateTime
    candidate: Candidate
}

type Candidate {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    contact: Contact
    locale: Locale
    name: String
    birthDate: Date
    cpf: Float   
    user: User 
    resume: Resume
    normalizedResume: NormalizedResume
    visibilitySettings: VisibilitySettings
    lookingForJob: Boolean
    inCareerTransition: Boolean
    careerTransitionTarget: String
    acceptsEntryLevel: Boolean
}

type NormalizedResume {
    id: ID
    candidateId: ID
    rawMarkdown: String
    summary: String
    skills: [String]
    careerGoals: String
    completenessScore: Int
    createdAt: DateTime
    updatedAt: DateTime
}

input CandidateCareerStatusInput {
    lookingForJob: Boolean
    inCareerTransition: Boolean
    careerTransitionTarget: String
    acceptsEntryLevel: Boolean
}

type VisibilitySettings {
    id: ID
    candidateId: ID
    searchableByRecruiters: Boolean
    openToWorkVisible: Boolean
    showAsViewed: Boolean
}

input VisibilitySettingsInput {
    searchableByRecruiters: Boolean
    openToWorkVisible: Boolean
    showAsViewed: Boolean
}

type Contact {
    mobilePhone: Float
}

type Locale {
    city: String
    state: String
    neighborhood: String
    number: String
    street: String
    zipCode: Int
}

input CandidateInput {    
    mobilePhone: Float!
    city: String!
    state: String!
    neighborhood: String!
    number: String!
    street: String!
    zipCode: Int!
    name: String!
    birthDate: Date!
    cpf: Float   
    userId: Int!
    lookingForJob: Boolean
    inCareerTransition: Boolean
    careerTransitionTarget: String
    acceptsEntryLevel: Boolean
}

type PaginatedListCandidate {
    candidates: [Candidate]
    start: Int
    end: Int,
    totalPages: Int,
    currentPage: Int,
    limitRows: Int,
    maxRows: Int
}

input NotificationInput {
    type: NotificationType!
    userId: Int!
    title: String!
    message: String!
}

enum NotificationType {
    MAIL,
    PUSH
}
