scalar Date
scalar DateTime

type Query {
    allResumes: [Resume]    
}

type Resume {
    id: ID,
    createdAt: DateTime
    updatedAt: DateTime
    uuid: String
    carrerLevel: CarrerLevel
    content: String
    objective: String
    presence: Presence
    candidate: Candidate
    educations: [Education]
    experiences: [Experience]
    skills: [Skill]
}

enum CarrerLevel{
    JUNIOR,
    MIDDLE,
    SENIOR,
    EXPERT
}

enum Presence {
    REMOTE,
    OFFICE,
    RELOCATION,
    TRAVEL_A_LOT
}

type Education {
    id: ID
    description: String
    endDate: Date
    qualification: String
    schoolName: String
    startDate: Date
}

type Experience {
    id: ID
    description: String
    employerName: String
    endDate: Date
    jobTitle: String
    startDate: Date
    responsibilities: String
}

type Skill {
    id: ID
    skillName: String
    months: Int
}