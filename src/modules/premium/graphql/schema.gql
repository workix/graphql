scalar Date
scalar DateTime

type Query {
    subscriptionPlans: [SubscriptionPlan]
    mySubscription(userId: ID!): UserSubscription
    allPlans: [Plan]
    organizationSubscription(organizationId: ID!): OrganizationSubscription
    checkCapability(organizationId: ID!, featureKey: String!, quantity: Int): CapabilityCheckResult
    organizationInvoices(organizationId: ID!): [Invoice]
}

type Mutation {
    createSubscriptionPlan(name: String!, price: Float!, billingPeriod: String, inmailCreditsPerMonth: Int): SubscriptionPlan
    subscribeToPlan(userId: ID!, planId: ID!): UserSubscription
    subscribeOrganizationToPlan(organizationId: ID!, planCode: String!, founderDiscountPct: Float): OrganizationSubscription
    pauseSubscription(subscriptionId: ID!): Boolean
    cancelSubscription(subscriptionId: ID!): Boolean
    createPixCharge(organizationId: ID!, sku: String!, amountCents: Int!, creditsCount: Int): PixChargeResult
    simulateGatewayWebhook(gateway: String!, gatewayEventId: String!, type: String!, payloadJson: String!): WebhookProcessResult
}

type PixChargeResult {
    purchaseId: ID
    amountCents: Int
    qrCode: String
    copyPastePix: String
    gatewayChargeId: String
}

type WebhookProcessResult {
    status: String
    eventId: ID
}

type Invoice {
    id: ID
    organizationId: ID
    subscriptionId: ID
    amountCents: Int
    status: String
    gatewayInvoiceId: String
    nfseNumber: String
    nfseUrl: String
    dueDate: DateTime
    paidAt: DateTime
    createdAt: DateTime
}

type Plan {
    id: ID
    code: String
    name: String
    priceCents: Int
    currency: String
    interval: String
    active: Boolean
    features: [PlanFeature]
}

type PlanFeature {
    id: ID
    planId: ID
    featureKey: String
    limitValue: Int
    enabled: Boolean
}

type OrganizationSubscription {
    id: ID
    organizationId: ID
    planId: ID
    status: String
    gatewayCustomerId: String
    gatewaySubscriptionId: String
    currentPeriodStart: DateTime
    currentPeriodEnd: DateTime
    trialEndsAt: DateTime
    cancelAtPeriodEnd: Boolean
    founderDiscountPct: Float
    plan: Plan
}

type CapabilityCheckResult {
    allow: Boolean
    reason: String
    upgradeTo: String
    limit: Int
    currentUsage: Int
}

type SubscriptionPlan {
    id: ID
    name: String
    price: Float
    billingPeriod: String
    inmailCreditsPerMonth: Int
    createdAt: DateTime
    updatedAt: DateTime
}

type UserSubscription {
    id: ID
    userId: ID
    planId: ID
    status: String
    inmailCreditsRemaining: Int
    startedAt: DateTime
    expiresAt: DateTime
    createdAt: DateTime
    updatedAt: DateTime
}
